---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dockyards-cluster-api
rules:
- apiGroups:
  - cluster.x-k8s.io
  resources:
  - clusters
  verbs:
  - create
  - get
  - list
  - patch
  - watch
- apiGroups:
  - cluster.x-k8s.io
  resources:
  - machines
  verbs:
  - get
  - list
  - patch
  - watch
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - dockyards.io
  resources:
  - clusters
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - dockyards.io
  resources:
  - clusters/status
  verbs:
  - patch
- apiGroups:
  - dockyards.io
  resources:
  - nodepools
  verbs:
  - get
  - list
  - patch
  - watch
- apiGroups:
  - dockyards.io
  resources:
  - nodes
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - watch
- apiGroups:
  - dockyards.io
  resources:
  - nodes/status
  verbs:
  - patch
- apiGroups:
  - dockyards.io
  resources:
  - workloadinventories
  verbs:
  - get
  - list
  - patch
  - watch
- apiGroups:
  - dockyards.io
  resources:
  - workloads
  verbs:
  - get
  - list
  - watch
